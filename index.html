<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reto AR - Saluda a mi avatar</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
    <script>
      // Oculta el elemento en AR (para ver la cámara real) y lo restaura al salir
      AFRAME.registerComponent("hide-in-ar", {
        init: function () {
          const scene = this.el.sceneEl;
          scene.addEventListener("enter-vr", () => {
            if (scene.is("ar-mode")) this.el.setAttribute("visible", false);
          });
          scene.addEventListener("exit-vr", () => {
            this.el.setAttribute("visible", true);
          });
        },
      });

      // Escala el modelo a una altura fija y lo apoya en el suelo
      AFRAME.registerComponent("fit-model", {
        schema: { height: { default: 1.7 } },
        init: function () {
          this.el.addEventListener("model-loaded", () => {
            const obj = this.el.getObject3D("mesh");
            const box = new THREE.Box3().setFromObject(obj);
            const size = box.getSize(new THREE.Vector3());
            if (size.y > 0) obj.scale.multiplyScalar(this.data.height / size.y);
            box.setFromObject(obj);
            obj.position.y -= box.min.y;
          });
          this.el.addEventListener("model-error", (e) => {
            console.error("ERROR cargando model.glb:", e);
          });
        },
      });

      // Mantiene la cadera del personaje sobre el eje del pivote,
      // así al girar el pivote el personaje rota sobre sí mismo
      AFRAME.registerComponent("center-on-pivot", {
        schema: { pivot: { type: "selector" } },
        init: function () {
          this.bone = null;
          this.v = new THREE.Vector3();
          this.el.addEventListener("model-loaded", () => {
            const obj = this.el.getObject3D("mesh");
            let hips = null;
            let first = null;
            obj.traverse((n) => {
              if (n.isBone) {
                first = first || n;
                if (!hips && /hips|pelvis/i.test(n.name)) hips = n;
              }
            });
            this.bone = hips || first;
            console.log("Hueso de referencia:", this.bone && this.bone.name);
          });
        },
        tick: function () {
          if (!this.bone) return;
          const pivot = this.data.pivot.object3D;
          this.bone.getWorldPosition(this.v);
          pivot.worldToLocal(this.v);
          this.el.object3D.position.x -= this.v.x;
          this.el.object3D.position.z -= this.v.z;
        },
      });

      // Botón de prueba: gira el avatar sobre sí mismo de 90 en 90°
      window.addEventListener("DOMContentLoaded", () => {
        let angle = 180;
        const btn = document.getElementById("rotar");
        btn.addEventListener("click", () => {
          angle = (angle + 90) % 360;
          document.getElementById("pivot").setAttribute("rotation", `0 ${angle} 0`);
          btn.textContent = `Girar 90° (ángulo actual: ${angle}°)`;
        });
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <button
      id="rotar"
      style="position: fixed; bottom: 10px; left: 10px; z-index: 999; padding: 10px 14px; font-size: 16px;"
    >
      Girar 90° (ángulo actual: 180°)
    </button>

    <a-scene xr-mode-ui="XRMode: xr;">
      <!-- Luces -->
      <a-entity light="type: ambient; intensity: 1.2"></a-entity>
      <a-entity light="type: directional; intensity: 0.8" position="1 3 2"></a-entity>

      <!-- Cielo y suelo (solo fuera de AR) -->
      <a-sky hide-in-ar color="#87CEEB"></a-sky>
      <a-plane hide-in-ar rotation="-90 0 0" width="10" height="10" color="#999"></a-plane>

      <!-- Contenedor con el ángulo de 180° original -->
      <a-entity position="0 0 -2" rotation="0 180 0">
        <!-- Pivote: gira al avatar sobre sí mismo -->
        <a-entity id="pivot" rotation="0 180 0">
          <a-entity
            gltf-model="url(model.glb)"
            fit-model="height: 1.7"
            animation-mixer="clip: *; loop: repeat"
            center-on-pivot="pivot: #pivot"
          ></a-entity>
        </a-entity>

        <!-- Saludo -->
        <a-text
          value="¡Hola!"
          align="center"
          color="#ffffff"
          width="4"
          position="0 2.2 0"
          rotation="0 180 0"
        ></a-text>
      </a-entity>

      <!-- Cámara -->
      <a-entity camera look-controls position="0 1.6 0"></a-entity>
    </a-scene>
  </body>
</html>
